server:
  port: 0

spring:
  application:
    name: whatsapp-service-test
  datasource:
    url: jdbc:h2:mem:govflow_whatsapp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS whatsapp_schema
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: whatsapp_schema
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672

govflow:
  whatsapp:
    active-provider: EVOLUTION
    evolution:
      base-url: http://localhost:8084
      api-key: test-api-key
      instance-name: test-instance
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      access-key: test-access-key
      secret-key: test-secret-key
      bucket-documents: govflow-documents
      path-style-access: true
    rabbitmq:
      exchange: govflow.events
      dlx: govflow.dlx
      queue-documentos: fila.documentos.extrair
      routing-key-documentos: whatsapp.documento.recebido
      queue-audios: fila.audios.transcrever
      routing-key-audios: whatsapp.audio.recebido

logging:
  level:
    root: INFO
    br.com.govflow.whatsapp: DEBUG
