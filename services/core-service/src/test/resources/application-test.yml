server:
  port: 0

spring:
  application:
    name: core-service-test
  datasource:
    url: jdbc:h2:mem:govflow_core_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS core_schema
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: core_schema
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  rabbitmq:
    listener:
      simple:
        auto-startup: false

govflow:
  rabbitmq:
    exchange: govflow.events
    queue-documentos-processados: fila.documentos.processados
    routing-key-documento-pronto: documento.pronto.transferegov
    routing-key-documento-rejeitado: documento.rejeitado

logging:
  level:
    root: INFO
    br.com.govflow.core: DEBUG
    org.hibernate.orm.tenant: DEBUG
