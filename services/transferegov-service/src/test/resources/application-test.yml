server:
  port: 0

spring:
  application:
    name: transferegov-service-test
  datasource:
    url: jdbc:h2:mem:transferegovdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS transferegov_schema
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: transferegov_schema
        format_sql: false
    show-sql: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

govflow:
  transferegov:
    siconv:
      base-url: http://localhost:8089/downloads/dadosgov
      uf-filter: PB
      connect-timeout-ms: 2000
      read-timeout-ms: 5000
      cron: "-"
      batch-size: 50
    rabbitmq:
      exchange: govflow.events
      routing-key-alerta-prazo: transferegov.prazo.alerta

logging:
  level:
    root: WARN
    br.com.govflow.transferegov: DEBUG
